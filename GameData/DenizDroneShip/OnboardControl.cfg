// Adds onboard control and power to the new barge; no extra physics parts.
@PART[SpaceXDroneship]:FINAL
{
    !MODULE[ModuleDecouple] {}
    MODULE
    {
        name = ModuleCommand
        minimumCrew = 0
        RESOURCE
        {
            name = ElectricCharge
            rate = 0.01
        }
    }
    MODULE
    {
        name = ModuleGenerator
        isAlwaysActive = true
        OUTPUT_RESOURCE
        {
            name = ElectricCharge
            rate = 1
        }
    }
    RESOURCE
    {
        name = ElectricCharge
        amount = 100
        maxAmount = 100
    }
    MODULE
    {
        name = ModuleDataTransmitter
        antennaType = INTERNAL
        packetInterval = 1
        packetSize = 2
        packetResourceCost = 12
        requiredResource = ElectricCharge
        antennaPower = 5000
        optimumRange = 2500
        packetFloor = .1
        packetCeiling = 5
    }
}
