// Personal practice craft. The original SEP parts stay available.
+PART[SEP_24_SHIP_PROTO_BODY]:NEEDS[StarshipExpansionProject,kOS]:AFTER[StarshipExpansionProject]
{
    @name = Codex_SEP_SN15_Test
    @title = Starship SN15 - kOS Practice Body
    @description = Practice body for the supplied Starship Bellyflop Trainer craft. Reduced propellant capacity keeps its mass suitable for a vertical hop with infinite fuel. Integrated kOS computer; no automatic flight program.
    @MODULE[ModuleB9PartSwitch]:HAS[#moduleID[SEP_Fuel]]
    {
        @baseVolume = 8000
    }
    MODULE
    {
        name = kOSProcessor
        diskSpace = 200000
        ECPerBytePerSecond = 0
        ECPerInstruction = 0.000004
    }
}
